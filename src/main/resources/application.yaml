spring:
  application:
    name: bonus-server

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5433/bonus_db}
    username: ${DB_USERNAME:bonus_user}
    password: ${DB_PASSWORD:bonus_password}
    driver-class-name: org.postgresql.Driver

  jpa:
    open-in-view: false

    hibernate:
      ddl-auto: validate

    properties:
      hibernate:
        format_sql: true

    show-sql: false
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    baseline-version: 1
    baseline-description: "Stage 1 baseline"
    validate-on-migrate: true
    clean-disabled: true


server:
  port: ${SERVER_PORT:8080}