services:

  postgres:
    image: postgres:17-alpine
    container_name: bonus-server-postgres

    environment:
      POSTGRES_DB: bonus_db
      POSTGRES_USER: bonus_user
      POSTGRES_PASSWORD: bonus_password

    ports:
      - "5433:5432"

    volumes:
      - bonus-postgres-data:/var/lib/postgresql/data

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U bonus_user -d bonus_db"
        ]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  bonus-postgres-data: